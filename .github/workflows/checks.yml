name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q handoff.py handoff_mcp.py tests
      - run: python scripts/check_source.py
      - run: python scripts/build_source.py
      - run: python scripts/build_plugins.py --output dist/plugins-ci
