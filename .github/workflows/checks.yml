name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q handoff.py handoff_mcp.py migration.py tests
      - run: python scripts/check_source.py
      - run: npm test && npm run check
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: npm exec --yes --ignore-scripts --package pyright@1.1.414 -- pyright --level error
      - run: python scripts/build_source.py
      - run: python scripts/build_plugins.py --output dist/plugins-ci
      - run: npm pack --ignore-scripts --pack-destination dist
      - run: npx --offline --ignore-scripts --package ./dist/huzaifa-asif-cross-agent-handoff-1.0.0.tgz handoff --doctor
  desktop-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: npm run check && npm test
        working-directory: desktop
